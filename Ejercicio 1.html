
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Botón interactivo</title>
</head>
<body>
    <p id="mensaje">Esperando una acción...</p>
    <button id="boton">Presionar</button>

    <script>
        const mensaje = document.getElementById("mensaje");
        const boton = document.getElementById("boton");

        boton.addEventListener("click", function() {
            mensaje.textContent = "¡Botón presionado!";
        });
    </script>
</body>
</html>
